<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>UV 展开互动演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1117; font-family: -apple-system, "PingFang SC", sans-serif; }
  #info {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    background: rgba(13,17,23,0.9); padding: 8px 12px;
    font-size: 12px; color: #8b949e; text-align: center;
    backdrop-filter: blur(8px); border-bottom: 1px solid #30363d;
  }
  #info strong { color: #58a6ff; }
</style>
</head>
<body>
<div id="app"></div>
<div id="info">拖动下方的<strong>彩色圆点</strong>改变 UV 坐标，看上方立方体纹理怎么变形</div>

<script type="importmap">
{ "imports": { "three": "../assets/three.module.js" } }
</script>

<script type="module">
// 全局错误捕获
window.__errors = [];
window.addEventListener('error', e => window.__errors.push(e.message));
window.addEventListener('unhandledrejection', e => window.__errors.push('Promise: ' + e.reason));

import * as THREE from 'three';
import { OrbitControls } from '../assets/OrbitControls.js';

// ================= SplitDemo 组件（内联） =================
class SplitDemo {
  constructor(opts = {}) {
    this.topRatio = opts.topRatio || 0.55;
    this.topLabel = opts.topLabel || '3D 视图';
    this.bottomLabel = opts.bottomLabel || '2D 编辑器';
    this.handles = [];
    this._buildDOM();
    this._build3D();
    this._bindEvents();
  }

  _buildDOM() {
    const container = document.getElementById('app') || document.body;
    container.innerHTML = '';
    container.style.cssText = 'position:fixed;inset:0;display:flex;flex-direction:column;background:#0d1117;overflow:hidden;';

    this.topEl = document.createElement('div');
    this.topEl.style.cssText = `flex:0 0 ${this.topRatio * 100}%;position:relative;overflow:hidden;`;
    container.appendChild(this.topEl);

    const divider = document.createElement('div');
    divider.style.cssText = 'height:2px;background:#30363d;flex-shrink:0;';
    container.appendChild(divider);

    this.botEl = document.createElement('div');
    this.botEl.style.cssText = 'flex:1;position:relative;overflow:hidden;';
    container.appendChild(this.botEl);

    for (const [el, text] of [[this.topEl, this.topLabel], [this.botEl, this.bottomLabel]]) {
      const label = document.createElement('div');
      label.textContent = text;
      label.style.cssText = 'position:absolute;top:8px;left:12px;z-index:5;font-size:11px;color:#58a6ff;font-weight:600;background:rgba(0,0,0,.5);padding:3px 8px;border-radius:6px;pointer-events:none;';
      el.appendChild(label);
    }
  }

  _build3D() {
    const S = 0.5;
    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    const el = this.renderer.domElement;
    el.style.cssText = 'position:absolute;top:0;left:0;transform-origin:0 0;';
    this.topEl.appendChild(el);

    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x0d1117);

    this.camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    this.camera.position.set(2.5, 2, 2.5);

    this.scene.add(new THREE.AmbientLight(0x8899bb, 1.5));
    const dir = new THREE.DirectionalLight(0xffffff, 2.0);
    dir.position.set(3, 4, 5);
    this.scene.add(dir);

    this.controls = new OrbitControls(this.camera, el);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.08;
    this.controls.enablePan = false;

    this._S = S;
    this._fitRenderer();
  }

  _fitRenderer() {
    const w = this.topEl.clientWidth;
    const h = this.topEl.clientHeight;
    this.renderer.setSize(w, h, false);
    const el = this.renderer.domElement;
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    el.style.transform = `translate(${w * 0.25}px, ${h * 0.25}px) scale(${this._S})`;
    this.camera.aspect = w / h;
    this.camera.updateProjectionMatrix();
  }

  addHandle(opts) {
    const h = {
      x: opts.x || 0,
      y: opts.y || 0,
      color: opts.color || '#58a6ff',
      label: opts.label || '',
      size: opts.size || 32,
      onDrag: opts.onDrag || (() => {}),
      el: null,
    };

    const el = document.createElement('div');
    el.style.cssText = `
      position:absolute;
      width:${h.size}px;height:${h.size}px;
      border-radius:50%;
      background:${h.color};
      border:3px solid rgba(255,255,255,0.8);
      box-shadow:0 0 12px ${h.color}40;
      cursor:grab;
      touch-action:none;
      z-index:10;
      transform:translate(-50%,-50%);
      display:flex;align-items:center;justify-content:center;
      font-size:9px;font-weight:700;color:#fff;
      user-select:none;
      -webkit-user-select:none;
    `;
    el.textContent = h.label;

    this.botEl.appendChild(el);
    h.el = el;
    this.handles.push(h);
    this._positionHandle(h);
    return h;
  }

  _positionHandle(h) {
    const w = this.botEl.clientWidth;
    const hgt = this.botEl.clientHeight;
    h.el.style.left = (h.x * w) + 'px';
    h.el.style.top = (h.y * hgt) + 'px';
    // 同步更新存储的坐标（用于事件匹配）
    h._currentX = h.x;
    h._currentY = h.y;
  }

  _bindEvents() {
    let dragHandle = null;

    const getPos = (e) => {
      const rect = this.botEl.getBoundingClientRect();
      const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      return [cx / rect.width, cy / rect.height];
    };

    const onDown = (e) => {
      const [nx, ny] = getPos(e);
      window.__onDownLog = { nx, ny, handleCount: this.handles.length };
      let bestDist = 0.15;
      for (let i = 0; i < this.handles.length; i++) {
        const h = this.handles[i];
        // 用 DOM 元素的实际位置计算距离
        const rect = h.el.getBoundingClientRect();
        const botRect = this.botEl.getBoundingClientRect();
        const hx = (rect.left + rect.width/2 - botRect.left) / botRect.width;
        const hy = (rect.top + rect.height/2 - botRect.top) / botRect.height;
        const d = Math.hypot(nx - hx, ny - hy);
        window.__onDownLog['handle' + i] = { hx, hy, d };
        if (d < bestDist) {
          bestDist = d;
          dragHandle = h;
        }
      }
      if (dragHandle) {
        // 不调用 e.preventDefault()，否则会阻止后续的 touchmove
        dragHandle.el.style.cursor = 'grabbing';
        dragHandle.el.style.boxShadow = `0 0 20px ${dragHandle.color}80`;
        window.__onDownLog.matched = dragHandle.label;
      }
    };

    const onMove = (e) => {
      window.__onMoveCalled = (window.__onMoveCalled || 0) + 1;
      window.__onMoveDragHandle = !!dragHandle;
      if (!dragHandle) return;
      window.__onMoveHasOnDrag = typeof dragHandle.onDrag === 'function';
      window.__onMoveOnDragType = typeof dragHandle.onDrag;
      e.preventDefault();
      const [nx, ny] = getPos(e);
      dragHandle.x = Math.max(0, Math.min(1, nx));
      dragHandle.y = Math.max(0, Math.min(1, ny));
      this._positionHandle(dragHandle);
      if (typeof dragHandle.onDrag === 'function') {
        try {
          dragHandle.onDrag(dragHandle.x, dragHandle.y);
          window.__onDragSuccess = true;
        } catch(e) {
          window.__onDragError = e.message;
        }
      }
    };

    const onUp = () => {
      if (dragHandle) {
        dragHandle.el.style.cursor = 'grab';
        dragHandle.el.style.boxShadow = `0 0 12px ${dragHandle.color}40`;
        dragHandle = null;
      }
    };

    this.botEl.addEventListener('pointerdown', onDown);
    this.botEl.addEventListener('pointermove', onMove);
    this.botEl.addEventListener('pointerup', onUp);
    this.botEl.addEventListener('touchstart', onDown, { passive: false });
    this.botEl.addEventListener('touchmove', onMove, { passive: false });
    this.botEl.addEventListener('touchend', onUp);
  }

  init3D(fn) {
    fn(this.scene, this.camera, this.renderer);
    this._fitRenderer();
  }

  setBottomCanvas(drawFn) {
    const cv = document.createElement('canvas');
    cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
    this.botEl.insertBefore(cv, this.botEl.firstChild?.nextSibling);

    const redraw = () => {
      const w = this.botEl.clientWidth;
      const h = this.botEl.clientHeight;
      cv.width = w * 2;
      cv.height = h * 2;
      const ctx = cv.getContext('2d');
      ctx.setTransform(2, 0, 0, 2, 0, 0);
      drawFn(ctx, w, h);
    };
    redraw();
    window.addEventListener('resize', redraw);
    return { canvas: cv, redraw };
  }

  start(onFrame) {
    const clock = new THREE.Clock();
    const animate = () => {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      const t = clock.elapsedTime;
      if (this.controls) this.controls.update();
      if (onFrame) onFrame(dt, t);
      this.renderer.render(this.scene, this.camera);
    };
    animate();

    window.addEventListener('resize', () => {
      this._fitRenderer();
      this.handles.forEach(h => this._positionHandle(h));
    });
  }
}

// ================= 棋盘纹理 =================
function makeCheckerTexture() {
  const W = 256, H = 256;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const n = 8, cw = W / n, ch = H / n;
  for (let r = 0; r < n; r++)
    for (let c = 0; c < n; c++) {
      ctx.fillStyle = (r + c) % 2 === 0 ? '#e8dcc8' : '#8a4513';
      ctx.fillRect(c * cw, r * ch, cw, ch);
    }
  ctx.fillStyle = '#ff4444';
  ctx.font = 'bold 20px sans-serif';
  ctx.fillText('(0,1)', 4, 22);
  ctx.fillText('(1,1)', W - 52, 22);
  ctx.fillText('(0,0)', 4, H - 8);
  ctx.fillText('(1,0)', W - 52, H - 8);
  ctx.beginPath(); ctx.arc(W/2, H/2, 6, 0, Math.PI * 2); ctx.fill();
  return { texture: new THREE.CanvasTexture(cv), canvas: cv };
}

const { texture: checkerTex, canvas: checkerCanvas } = makeCheckerTexture();

// ================= 创建 SplitDemo =================
const demo = new SplitDemo({
  topRatio: 0.55,
  topLabel: '🧊 3D 平面',
  bottomLabel: '📐 UV 地图',
});

// 3D 场景
demo.init3D((scene, camera, renderer) => {
  // 立方体 — 每个面都能看到 UV 变化
  const boxGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2, 1, 1, 1);
  const boxMat = new THREE.MeshStandardMaterial({
    map: checkerTex, metalness: 0, roughness: 0.8
  });
  const box = new THREE.Mesh(boxGeo, boxMat);
  scene.add(box);
  window.__boxGeo = boxGeo;

  camera.position.set(2, 1.5, 2);
  camera.lookAt(0, 0, 0);
});

// 2D 编辑器背景
demo.setBottomCanvas((ctx, w, h) => {
  const size = Math.min(w, h) * 0.75;
  const ox = (w - size) / 2;
  const oy = (h - size) / 2;

  ctx.globalAlpha = 0.5;
  ctx.drawImage(checkerCanvas, ox, oy, size, size);
  ctx.globalAlpha = 1;

  ctx.strokeStyle = '#30363d';
  ctx.lineWidth = 2;
  ctx.strokeRect(ox, oy, size, size);

  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 0.5;
  for (let i = 1; i < 4; i++) {
    const p = ox + (i / 4) * size;
    ctx.beginPath(); ctx.moveTo(p, oy); ctx.lineTo(p, oy + size); ctx.stroke();
    const q = oy + (i / 4) * size;
    ctx.beginPath(); ctx.moveTo(ox, q); ctx.lineTo(ox + size, q); ctx.stroke();
  }

  const handles = demo.handles;
  if (handles.length >= 4) {
    ctx.strokeStyle = 'rgba(88,166,255,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    const order = [0, 1, 3, 2, 0];  // (0,0)→(1,0)→(1,1)→(0,1)→(0,0) 顺时针
    for (let i = 0; i < order.length; i++) {
      const h = handles[order[i]];
      const px = ox + h.x * size;
      const py = oy + (1 - h.y) * size;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.stroke();
  }

  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.font = '11px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('U →', ox + size / 2, oy + size + 18);
  ctx.save();
  ctx.translate(ox - 16, oy + size / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText('V →', 0, 0);
  ctx.restore();
});

// UV 手柄
const handleColors = ['#ff4444', '#44ff44', '#4488ff', '#ffaa00'];
const handleLabels = ['(0,0)', '(1,0)', '(0,1)', '(1,1)'];
const initialUVs = [[0, 0], [1, 0], [0, 1], [1, 1]];

for (let i = 0; i < 4; i++) {
  demo.addHandle({
    x: initialUVs[i][0] * 0.75 + 0.125,
    y: (1 - initialUVs[i][1]) * 0.75 + 0.125,
    color: handleColors[i],
    label: handleLabels[i],
    size: 32,
    onDrag: (x, y) => {
      const u = (x - 0.125) / 0.75;
      const v = 1 - (y - 0.125) / 0.75;
      updateBoxUV(i, u, v);
    }
  });
}

function updateBoxUV(vertexIdx, u, v) {
  window.__updateBoxUVCalled = (window.__updateBoxUVCalled || 0) + 1;
  const geo = window.__boxGeo;
  const uvAttr = geo.attributes.uv;
  
  // BoxGeometry 每个面的顶点顺序统一为：
  // vi 0: UV(0,1) 左上, vi 1: UV(1,1) 右上, vi 2: UV(0,0) 左下, vi 3: UV(1,0) 右下
  // 手柄索引到顶点索引的映射：
  const handleToVertex = [2, 3, 0, 1];  // 手柄0(0,0)→vi2, 手柄1(1,0)→vi3, 手柄2(0,1)→vi0, 手柄3(1,1)→vi1
  
  const vi = handleToVertex[vertexIdx];
  for (let face = 0; face < 6; face++) {
    const idx = face * 4 + vi;
    uvAttr.setXY(idx, u, v);
  }
  // 强制标记更新
  uvAttr.needsUpdate = true;
}

demo.start(() => {
  window.__animFrame = (window.__animFrame || 0) + 1;
  if (window.__boxGeo) {
    window.__boxGeo.attributes.uv.needsUpdate = true;
  }
});
</script>
</body>
</html>
